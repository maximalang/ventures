schema: hermes-fleet-policy
version: 1
safe_defaults:
  fail_closed_state_changes: true
  fail_open_read_only: true
  read_sampling_rate: 0.1
  task_type_source: exact_marker_in_task_body_comment_or_skill
  task_type_markers:
    - "task_type: <research|code|review|ops>"
    - "task_type=<research|code|review|ops>"
  monetary_cost_when_unreported: unavailable
budgets:
  research:
    tokens: 120000
    wall_clock_minutes: 90
    tool_calls: 80
    retries: 2
  code:
    tokens: 180000
    wall_clock_minutes: 120
    tool_calls: 140
    retries: 2
  review:
    tokens: 60000
    wall_clock_minutes: 45
    tool_calls: 50
    retries: 2
  ops:
    tokens: 50000
    wall_clock_minutes: 30
    tool_calls: 40
    retries: 2
anti_loop:
  max_identical_calls: 3
  max_same_failure: 2
  max_idle_turns: 3
  max_retries: 2
protected:
  branches: [main, master, production, release]
  paths:
    - ".env*"
    - "**/.env*"
    - "auth.json"
    - "**/auth.json"
    - "**/*credential*"
    - "**/*secret*"
    - "**/sessions/**"
    - "**/request_dump/**"
    - "**/request_dump*"
    - "**/dumps/**"
    - "**/.state/fleet-policy.db*"
policy_rules:
  autonomous:
    - research_with_sources
    - plans_specs_docs_local_artifacts
    - codex_branch_code_test_build_review
    - commit_push_codex_branch
    - private_repo_after_go
    - kanban_task_routing
    - read_only_state_checks
  approval_required:
    - deploy_external_runtime
    - public_outreach_or_publication
    - payments_subscriptions_or_budget
    - destructive_delete_cleanup_or_migration
    - rewrite_history
    - protected_branch_push_or_merge
    - new_credentials_or_permissions
    - security_or_privacy_change
    - private_to_public
  hard_deny:
    - secret_read_or_write
    - worker_self_approval
    - missing_or_unknown_task_type
projects:
  rr-team:
    project: recruiter-radar
    path: "C:/Users/max/Desktop/all/recruiter-radar"
    guidance: "skills/rr-project/SKILL.md"
  portfolio:
    project: portfolio
    path: "C:/Users/max/Desktop/all/ventures"
  venture-lab:
    project: venture-lab
    path: "C:/Users/max/Desktop/all/ventures/venture-lab"
notifications:
  significant_only: true
  events: [deny, approval_required, budget_exhausted, loop_stop, rollback, critical_error]
  allow_spam: false
  profile: company
  channel: "Bot Chat"
retention:
  events_days: 90
  call_history_days: 30
  approvals_days: 365
overrides:
  model: narrowing_only
  allow_relaxation: false
  source: exact_task_markers
