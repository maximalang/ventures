[build-system]
requires = ["setuptools>=68,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "ventures-fleet-policy"
version = "1.2.7"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7"]

[project.scripts]
fleet-policy = "fleet_policy.cli:main"

[dependency-groups]
dev = ["jsonschema>=4.23,<5", "pytest>=8.3,<10", "referencing>=0.35,<1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

