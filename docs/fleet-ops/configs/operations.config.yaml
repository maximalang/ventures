model:
  default: glm-5.3-flash
  provider: zai
  base_url: https://api.z.ai/api/coding/paas/v4
  max_tokens: 16384
  reasoning_echo: false
  fallback_providers:
    - provider: zai
      model: glm-5.3
      base_url:
    - provider: custom
      model: qwen-3.8-max
      base_url: https://cheapmodels.xyz/v1
      key_env: HERMES_CUSTOM_CHEAPMODELS_API_KEY
    - provider: custom
      model: qwen-3.8-max
      base_url: https://cheapmodels.xyz/v1
      key_env: HERMES_CUSTOM_CHEAPMODELS_API_KEY
providers:
  custom:
    name: cheapmodels
    base_url: https://cheapmodels.xyz/v1
    model: qwen-3.8-max
    key_env: HERMES_CUSTOM_CHEAPMODELS_API_KEY
    discover_models: false
    models:
      - id: qwen-3.8-max
      - id: kimi-k3
      - id: qwen-vl-max
    provider: custom
credential_pool_strategies:
  openai-codex: round_robin
  zai: fill_first
database:
  journal_mode: wal
runtime:
  nofile_soft_limit: 4096
max_live_sessions: 24
agent:
  max_turns: 500
  coding_context: focus
  reasoning_overrides:
    glm-5.3-flash: high
    kimi-k3: max
    qwen-3.8-max: max
    gpt-6-sol: high
    gpt-6.1-sol: high
  verbose: false
  reasoning_effort: high
  personalities: {}
terminal:
  backend: local
  cwd: .
  timeout: 180
  home_mode: auto
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
  container_persistent: true
  docker_mount_cwd_to_workspace: false
  lifetime_seconds: 300
web:
  backend: exa
  search_backend: searxng
  extract_backend: exa
  provider_tier:
    exa: free
browser:
  inactivity_timeout: 120
  cloud_provider: local
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: false
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5
compression:
  enabled: true
  progress_notices: false
  threshold: 0.75
  target_ratio: 0.2
  tail_mode: lean
  protect_last_n: 20
  min_tail_user_messages: 3
  max_attempts: 3
  proactive_prune_tokens: 48000
  proactive_prune_min_result_chars: 8000
  proactive_prune_min_reclaim_tokens: 4096
  context_timeout_seconds: 300
  context_total_ceiling_seconds: 900
  protect_first_n: 3
  codex_gpt55_autoraise: true
  codex_app_server_auto: native
  codex_responses_native: false
  codex_responses_compact_threshold: 200000
  idle_compact_after_seconds: 1800
prompt_caching:
  cache_ttl: 5m
auxiliary:
  transient_retries: 2
  free_only: false
  stream_only_base_urls: []
  vision:
    main_agent_fallback: false
    provider: gpt-free
    model: gpt-6-luna
    reasoning_effort: max
    timeout: 120
  skills_hub:
    provider: custom
    model: qwen-3.8-max
    base_url: https://cheapmodels.xyz/v1
    reasoning_effort: max
    key_env: HERMES_CUSTOM_CHEAPMODELS_API_KEY
