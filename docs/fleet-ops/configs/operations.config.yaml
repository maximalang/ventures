    model: qwen-3.8-max
    base_url: https://cheapmodels.xyz/v1
    reasoning_effort: max
    key_env: HERMES_CUSTOM_CHEAPMODELS_API_KEY
  moa_reference:
    provider: auto
    model: ''
    base_url: ''
    api_key: ''
