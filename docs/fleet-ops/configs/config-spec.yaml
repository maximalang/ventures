# Fleet config spec — desired state of hermes configs (single source of truth).
# The reconciler (config_integrity_watch.py) repairs fields FROM this spec;
# whole-file damage is restored from the git copy in this directory.
# Owner directive changes = edit this file. No frozen snapshots.
# RULE (incident 11.10 08:57): any fleet-wide model repin that touches a
# governed field MUST repoint this spec in the same change — the reconciler
# enforces this file within the hour and reverts "drift" that is actually
# the newer desired state (that mismatch rewrote 12 configs to a dead pin).
version: 1
recovery_ref: "bcd957c"   # pinned commit for whole-file restores (independent of repo checkout state)
updated: "2026-10-06"
memory_char_limit:
  profiles: 8000      # the 12 agent profiles; ROOT keeps its own standing value
line_floor:
  default: 250        # healthy files are 490-730 lines; gutted ones ~100
auxiliary:
  vision:
    provider: gpt-free
    model: gpt-6-luna
    reasoning_effort: max
    timeout: 120
  compression:
    provider: custom
    model: qwen-3.8-max
    reasoning_effort: low
    timeout: 300
    main_agent_fallback: false
forbidden_slot_keys: [fallback_providers, fallback_chain, fallback]
required_sections:
  ROOT: [gateway, kanban, memory, mcp_servers]
  profiles: [memory, kanban]
  company_extra: [telegram]
